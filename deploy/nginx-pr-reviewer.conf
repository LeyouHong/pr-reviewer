# TLS termination in front of the webhook receiver.
#
# The receiver binds to loopback and speaks plain HTTP on purpose: it is a
# stdlib server whose entire job is to verify a signature and write a file, and
# putting it on a public port would make it responsible for TLS, connection
# limits, and slow-client handling it has no business owning.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name reviewer.example.com;

    ssl_certificate     /etc/letsencrypt/live/reviewer.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reviewer.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # GitHub's own ceiling. A push touching thousands of files produces a large
    # payload, and rejecting it here would look like a flaky endpoint.
    client_max_body_size 25m;

    # Only the two paths that exist. Everything else is a scanner, and a 404
    # from nginx costs nothing.
    location = /webhook {
        proxy_pass http://127.0.0.1:8787/webhook;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The receiver enqueues and returns; it never waits on a review. Ten
        # seconds is already generous, and matches when GitHub gives up — a
        # longer timeout here would only turn a hung receiver into a hung
        # delivery instead of a fast failure GitHub will retry.
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # The signature covers the raw body; buffering is fine, but never let
        # nginx rewrite what it forwards.
        proxy_request_buffering on;
        proxy_http_version 1.1;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        # Health is for your own monitoring, not the internet.
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name reviewer.example.com;
    return 301 https://$host$request_uri;
}
