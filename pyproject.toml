[project]
name = "pr-reviewer"
version = "0.1.0"
description = "LLM code review agent for GitHub PRs, powered by DeepSeek V4 Pro"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
]

[project.optional-dependencies]
tokenizer = ["transformers>=4.44"]

[project.scripts]
pr-reviewer = "reviewer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewer"]
